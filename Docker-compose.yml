services:
  backend:
    build: ./backend
    container_name: daily-planner-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: daily-planner-db
    environment:
      POSTGRES_USER: planner_user
      POSTGRES_PASSWORD: planner_password
      POSTGRES_DB: daily_planner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: